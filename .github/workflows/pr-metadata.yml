name: PR Metadata

on:
  pull_request:
    types: [opened, edited, reopened]
    branches: [develop]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const types = ['feature', 'bugfix', 'hotfix', 'refactor', 'docs', 'chore'];
            const selected = types.find(type => new RegExp(`- \\[x\\] ${type}\\b`, 'i').test(body));
            if (!selected) return;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const label of issue.labels.map(item => typeof item === 'string' ? item : item.name).filter(name => name?.startsWith('change:') && name !== `change:${selected}`)) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name: label });
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: [`change:${selected}`] });
