name: PR Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request_target:
    types:
      [opened, edited, reopened, ready_for_review, converted_to_draft, synchronize, closed]
  issues:
    types:
      [opened, reopened, closed, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned]

permissions:
  contents: read

concurrency:
  group: pr-metadata-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || 'all' }}
  cancel-in-progress: true

jobs:
  sync:
    name: PR Metadata
    if: vars.GPA_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GPA_APP_CLIENT_ID }}
          private-key: ${{ secrets.GPA_APP_PRIVATE_KEY }}
          owner: Vintex-Ages
      - run: node .github/scripts/sync-pr-metadata.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
