name: Promote to vintex-prod

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-back-end
  cancel-in-progress: false

jobs:
  promote:
    if: vars.GPA_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GPA_APP_CLIENT_ID }}
          private-key: ${{ secrets.GPA_APP_PRIVATE_KEY }}
          owner: Vintex-Ages
      - run: node .github/scripts/promote-prod.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMPONENT: back-end
          PROD_REPOSITORY: Vintex-Ages/vintex-prod
